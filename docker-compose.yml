name: jobradar

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobradar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobradar}
      POSTGRES_DB: ${POSTGRES_DB:-jobradar}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres-init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jobradar}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-jobradar}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-jobradar}
    ports:
      - "15672:15672" # management UI: http://localhost:15672
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  users-service:
    build:
      context: .
      dockerfile: src/Services/JobRadar.Users/Dockerfile
    environment:
      ConnectionStrings__UsersDb: Host=postgres;Port=5432;Database=usersdb;Username=${POSTGRES_USER:-jobradar};Password=${POSTGRES_PASSWORD:-jobradar}
      RabbitMq__Host: rabbitmq
      RabbitMq__User: ${RABBITMQ_USER:-jobradar}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-jobradar}
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  jobaggregator-service:
    build:
      context: .
      dockerfile: src/Services/JobRadar.JobAggregator/Dockerfile
    environment:
      ConnectionStrings__AggregatorDb: Host=postgres;Port=5432;Database=aggregatordb;Username=${POSTGRES_USER:-jobradar};Password=${POSTGRES_PASSWORD:-jobradar}
      RabbitMq__Host: rabbitmq
      RabbitMq__User: ${RABBITMQ_USER:-jobradar}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-jobradar}
      Aggregator__PollIntervalMinutes: ${AGGREGATOR_POLL_INTERVAL_MINUTES:-10}
      Adzuna__AppId: ${ADZUNA_APP_ID:-}
      Adzuna__AppKey: ${ADZUNA_APP_KEY:-}
      Adzuna__Country: ${ADZUNA_COUNTRY:-us}
      Jooble__ApiKey: ${JOOBLE_API_KEY:-}
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  matching-service:
    build:
      context: .
      dockerfile: src/Services/JobRadar.Matching/Dockerfile
    environment:
      ConnectionStrings__MatchingDb: Host=postgres;Port=5432;Database=matchingdb;Username=${POSTGRES_USER:-jobradar};Password=${POSTGRES_PASSWORD:-jobradar}
      RabbitMq__Host: rabbitmq
      RabbitMq__User: ${RABBITMQ_USER:-jobradar}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-jobradar}
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  notifications-service:
    build:
      context: .
      dockerfile: src/Services/JobRadar.Notifications/Dockerfile
    environment:
      ConnectionStrings__NotificationsDb: Host=postgres;Port=5432;Database=notificationsdb;Username=${POSTGRES_USER:-jobradar};Password=${POSTGRES_PASSWORD:-jobradar}
      RabbitMq__Host: rabbitmq
      RabbitMq__User: ${RABBITMQ_USER:-jobradar}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-jobradar}
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  gateway:
    build:
      context: .
      dockerfile: src/Gateway/JobRadar.Gateway/Dockerfile
    ports:
      - "8080:8080" # <- this is the one address the MAUI client talks to
    depends_on:
      - users-service
      - jobaggregator-service
      - matching-service
      - notifications-service

volumes:
  postgres-data:
